            - paragraph [ref=e204]: Substack posts default to publishing to both the web and email. To publish a post only to the web, click the “Publish” button, then, on the next screen, make sure the box beside “Send email to…” is unchecked.
            - paragraph [ref=e205]:
              - emphasis [ref=e206]:
                - strong [ref=e207]: Note
              - text: ": Posts can only be emailed out once. Once you have sent an email out, the only way to send it again is to create an entirely new post. Any edits you make to a previously-published post will only be reflected on the web. So, there’s no need to worry about accidentally spamming your subscribers with repeat emails."
            - paragraph [ref=e208]: Finally, if you import posts from some other site’s archives, you can backdate them so they are published in the correct order and associated with the correct publication dates. To do so, after you have published a post, go into that post’s Settings (just to the left of the Publish button) and select the desired date.
