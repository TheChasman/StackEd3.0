        - heading "Common Mistakes" [level=2] [ref=e257]
        - heading "1. Using Horizontal Text" [level=3] [ref=e258]
        - paragraph [ref=e259]: Text in images often gets cut off on mobile or becomes unreadable at small sizes. Let Substack handle your title.
        - heading "2. Inconsistent Sizing" [level=3] [ref=e260]
        - paragraph [ref=e261]: Using different aspect ratios creates a messy publication page. Stick to 16:9 for all post headers.
        - heading "3. Over-Designed Images" [level=3] [ref=e262]
        - paragraph [ref=e263]: Substack's strength is content, not visuals. Overly designed images feel out of place and distract from your writing.
        - heading "4. Forgetting Mobile" [level=3] [ref=e264]
        - paragraph [ref=e265]: Over 50% of email opens are on mobile. Always preview on your phone.
        - heading "5. Stock Photo Clichés" [level=3] [ref=e266]
        - paragraph [ref=e267]: Handshakes, light bulbs, and "person typing" images are invisible. Find something that actually relates to your content.
        - heading "FAQ" [level=2] [ref=e268]
        - paragraph [ref=e269]:
          - strong [ref=e270]: "Q: Do I need a header image for every post?"
        - paragraph [ref=e271]: No. Some successful newsletters never use images. If you can't find something relevant, skip it rather than adding a generic placeholder.
        - paragraph [ref=e272]:
          - strong [ref=e273]: "Q: Can I change images after publishing?"
        - paragraph [ref=e274]: Yes, but the email is already sent. You can update the web version, but subscribers who already received it will see the original.
        - paragraph [ref=e275]:
          - strong [ref=e276]: "Q: Should I add my logo to post headers?"
        - paragraph [ref=e277]: Generally no. Substack already shows your publication name. Adding a logo is redundant and clutters the image.
        - paragraph [ref=e278]:
          - strong [ref=e279]: "Q: What about images within the post?"
        - paragraph [ref=e280]: Same 1456px width maximum. Use them sparingly—email clients can struggle with image-heavy messages.
        - paragraph [ref=e281]:
          - strong [ref=e282]: "Q: Do images affect deliverability?"
        - paragraph [ref=e283]: Image-heavy emails can trigger spam filters. If deliverability is a concern, use fewer and smaller images.
